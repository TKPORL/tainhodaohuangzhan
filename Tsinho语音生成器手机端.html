<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tsinho语音生成器</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-purple: #AF52DE;
            --bg: #F2F2F7;
            --card: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1c1c1e;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --separator: rgba(60, 60, 67, 0.12);
            --fill-1: rgba(120, 120, 128, 0.12);
            --fill-2: rgba(120, 120, 128, 0.16);
            --radius-card: 20px;
            --radius-item: 14px;
            --radius-pill: 999px;
            --shadow-1: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-2: 0 8px 25px rgba(0, 0, 0, 0.05);
            --ease: cubic-bezier(0.32, 0.72, 0, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 入场动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-header,
        .glass-card {
            opacity: 0;
            animation: fadeInUp 0.5s var(--ease) forwards;
        }
        .app-header { animation-delay: 0s; }
        .glass-card:nth-of-type(1) { animation-delay: 0.04s; }
        .glass-card:nth-of-type(2) { animation-delay: 0.08s; }
        .glass-card:nth-of-type(3) { animation-delay: 0.12s; }
        .glass-card:nth-of-type(4) { animation-delay: 0.16s; }
        .glass-card:nth-of-type(5) { animation-delay: 0.20s; }

        /* 页眉 */
        .app-header {
            text-align: center;
            padding: 8px 0 4px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* 玻璃卡片 */
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-1), var(--shadow-2);
            border: 1px solid var(--card-border);
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: -0.01em;
        }

        .card-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            width: 18px;
            height: 18px;
            color: var(--ios-blue);
        }

        .card-inline-btn {
            font-size: 13px;
            font-weight: 500;
            color: var(--ios-blue);
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background-color 0.2s var(--ease);
        }

        .card-inline-btn:hover {
            background: var(--fill-1);
        }

        .card-inline-btn.danger:hover {
            background: rgba(255, 59, 48, 0.12);
            color: var(--ios-red);
        }

        /* 角色网格 */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
            padding: 2px;
        }

        .character-grid::-webkit-scrollbar {
            width: 6px;
        }
        .character-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 3px;
        }

        .character-item {
            background: var(--fill-1);
            border-radius: var(--radius-pill);
            padding: 12px 14px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
            border: 1.5px solid transparent;
            user-select: none;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2px;
        }

        .character-item:hover {
            background: var(--fill-2);
            transform: translateY(-1px);
        }

        .character-item:active {
            transform: scale(0.96);
        }

        .character-item.selected {
            background: var(--ios-blue);
            color: #fff;
            border-color: var(--ios-blue);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }

        .character-item.failed {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .character-item .name {
            font-size: 14px;
            font-weight: 600;
            color: inherit;
            line-height: 1.3;
        }

        .character-item .category {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .character-item.selected .category {
            color: rgba(255, 255, 255, 0.75);
        }

        /* 分组标题 */
        .category-heading {
            grid-column: 1 / -1;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 4px 4px;
        }

        .category-heading:first-child {
            padding-top: 0;
        }

        /* 文本输入 */
        .text-input {
            width: 100%;
            min-height: 120px;
            padding: 14px 16px;
            background: var(--fill-1);
            border: 1.5px solid transparent;
            border-radius: var(--radius-item);
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            resize: vertical;
            font-family: inherit;
            outline: none;
            transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
        }

        .text-input::placeholder {
            color: var(--text-secondary);
        }

        .text-input:focus {
            background: #fff;
            border-color: var(--ios-blue);
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-right: 4px;
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            min-height: 48px;
            padding: 0 20px;
            border-radius: var(--radius-pill);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s var(--ease), background-color 0.2s var(--ease), opacity 0.2s var(--ease);
            white-space: nowrap;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--ios-blue);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
        }

        .btn-primary:hover {
            background: #0069d9;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: var(--fill-1);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--fill-2);
        }

        .btn-secondary:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: var(--ios-green);
            color: #fff;
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.25);
        }

        .btn-success:hover {
            background: #28a745;
        }

        .btn-success:active {
            transform: scale(0.96);
        }

        .btn-loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .btn-loading::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 播放器卡片 */
        .player-card {
            display: none;
        }

        .player-card.active {
            display: block;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .player-artwork {
            width: 48px;
            height: 48px;
            background: var(--ios-blue);
            border-radius: var(--radius-item);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }

        .player-meta {
            flex: 1;
            min-width: 0;
        }

        .player-meta h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .player-meta p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .audio-container {
            background: var(--fill-1);
            border-radius: var(--radius-item);
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
            height: 40px;
            display: block;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            padding: 0 20px;
            background: var(--ios-green);
            color: #fff;
            border-radius: var(--radius-pill);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.25);
            transition: transform 0.2s var(--ease), background-color 0.2s var(--ease);
        }

        .download-btn:hover {
            background: #28a745;
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 错误提示 */
        .error-hint {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: rgba(255, 59, 48, 0.10);
            border-radius: var(--radius-item);
            align-items: flex-start;
            gap: 10px;
        }

        .error-hint.show {
            display: flex;
        }

        .error-hint svg {
            width: 18px;
            height: 18px;
            color: var(--ios-red);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .error-hint span {
            font-size: 14px;
            color: var(--ios-red);
            line-height: 1.4;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -12px);
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
            z-index: 9999;
            white-space: nowrap;
            max-width: calc(100vw - 32px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .toast.error {
            background: rgba(255, 59, 48, 0.92);
        }

        /* 历史记录 */
        .history-list {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 3px;
        }

        .empty-history {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            padding: 28px 12px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--fill-1);
            border-radius: var(--radius-item);
            transition: background-color 0.2s var(--ease);
        }

        .history-item:hover {
            background: var(--fill-2);
        }

        .history-index {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--ios-blue);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-text {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-action-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-pill);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s var(--ease), background-color 0.2s var(--ease);
        }

        .history-action-btn.play {
            background: var(--ios-blue);
            color: #fff;
        }

        .history-action-btn.download {
            background: var(--ios-green);
            color: #fff;
        }

        .history-action-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.05);
        }

        .history-action-btn:active {
            transform: scale(0.94);
        }

        .history-action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 关于列表 */
        .about-list {
            background: var(--fill-1);
            border-radius: var(--radius-item);
            overflow: hidden;
        }

        .about-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--separator);
            cursor: pointer;
            transition: background-color 0.2s var(--ease);
        }

        .about-item:last-child {
            border-bottom: none;
        }

        .about-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .about-icon-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .about-icon-badge.blue { background: var(--ios-blue); }
        .about-icon-badge.green { background: var(--ios-green); }
        .about-icon-badge.purple { background: var(--ios-purple); }
        .about-icon-badge.orange { background: var(--ios-orange); }

        .about-info {
            flex: 1;
            min-width: 0;
        }

        .about-title-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .about-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .about-chevron {
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .about-chevron svg {
            width: 14px;
            height: 14px;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.25s var(--ease);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius-card);
            padding: 22px;
            box-shadow: var(--shadow-1), var(--shadow-2), 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--card-border);
            transform: translateY(8px) scale(0.98);
            transition: transform 0.3s var(--ease);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .modal-header-sub {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .modal-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--fill-1);
            border-radius: var(--radius-item);
            cursor: pointer;
            transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
        }

        .modal-list-item:hover {
            background: var(--fill-2);
        }

        .modal-list-item:active {
            transform: scale(0.98);
        }

        .modal-list-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }

        .modal-list-icon.blue { background: var(--ios-blue); }
        .modal-list-icon.green { background: var(--ios-green); }
        .modal-list-icon.purple { background: var(--ios-purple); }
        .modal-list-icon.orange { background: var(--ios-orange); }

        .modal-list-info {
            flex: 1;
            min-width: 0;
        }

        .modal-list-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .modal-list-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .app-container {
                padding: 20px 14px 36px;
                gap: 14px;
            }

            .app-header {
                padding: 6px 0 2px;
            }

            .app-title {
                font-size: 24px;
            }

            .glass-card {
                padding: 16px;
                border-radius: 18px;
            }

            .button-group {
                flex-direction: column;
                gap: 10px;
            }

            .character-grid {
                grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
                gap: 6px;
            }

            .character-item {
                padding: 10px 12px;
                min-height: 44px;
            }

            .character-item .name {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 页眉 -->
        <div class="app-header">
            <h1 class="app-title">Tsinho语音生成器</h1>
            <p class="app-subtitle">选择角色，输入文本，即刻生成自然语音</p>
        </div>

        <!-- 角色选择卡 -->
        <div class="glass-card">
            <div class="card-title">
                <span class="card-title-left">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    配音角色
                </span>
            </div>
            <div class="character-grid" id="characterGrid"></div>
        </div>

        <!-- 文本输入卡 -->
        <div class="glass-card">
            <div class="card-title">
                <span class="card-title-left">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

        // 生成语音
        async function generateVoice() {
            const text = document.getElementById('textInput').value.trim();

            if (!currentSelection) {
                showError('请先选择一个配音角色');
                return;
            }

            if (!text) {
                showError('请输入要转换的文本内容');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.classList.add('btn-loading');
            btn.disabled = true;

            try {
                let apiUrl;

                if (currentSelection.api === 'mbAIsc') {
                    apiUrl = `https://api.milorapart.top/apis/mbAIsc?text=${encodeURIComponent(text)}`;
                } else {
                    apiUrl = `https://api.milorapart.top/apis/AIvoice/?text=${encodeURIComponent(text)}&speaker=${encodeURIComponent(currentSelection.name)}`;
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const response = await fetch(apiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (data.code === 200 && data.url && data.url.trim() !== '') {
                    const audio = document.getElementById('audioPlayer');
                    audio.src = data.url;
                    document.getElementById('playerTitle').textContent = currentSelection.name;
                    document.getElementById('playerSubtitle').textContent = '点击播放';
                    document.getElementById('downloadLink').href = data.url;
                    document.getElementById('downloadLink').download = `voice_${currentSelection.name}_${Date.now()}.mp3`;
                    document.getElementById('playerCard').classList.add('active');

                    hideError();
                    showToast('语音生成成功！');

                    saveToHistory(currentSelection.name, text, data.url);
                } else if (data.code === 400 || data.code === 404 || data.msg) {
                    throw new Error(data.msg || '该角色暂时不可用');
                } else {
                    throw new Error('未返回有效的音频地址');
                }

            } catch (error) {
                if (currentSelection && (error.message.includes('不可用') || error.name === 'AbortError')) {
                    failedCharacters.add(currentSelection.name);
                    renderCharacterGrid();
                }
                showError(`生成失败: ${error.message}`);
                showToast('生成失败，请重试', true);
            } finally {
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
        }

            const history = getHistory();
            const record = {

                characterName,
                text: text.substring(0, 50) + (text.length > 50 ? '...' : ''),
                fullText: text,
                audioUrl,
                timestamp: new Date().toLocaleString('zh-CN')
            };

            history.unshift(record);
            if (history.length > 20) {
                history.pop();
            }

            localStorage.setItem('voice_history', JSON.stringify(history));
            renderHistory();
        }

        // 关闭关于弹窗
        function closeAboutModal() {
            const modal = document.getElementById('aboutModal');
            if (modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 250);
            }
        }

        // 跳转到链接
        function goToLink(url) {
            window.open(url, '_blank');
        }

        // 复制联系方式（含降级）
        function copyContact(type) {
            let text = '';
            switch(type) {
                case 'email': text = 'Tsinhos@qq.com'; break;
                case 'qq': text = '1625862774'; break;
            }

            const fallback = (txt) => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = txt;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('已复制');
                } catch {
                    showToast('复制失败，请手动复制', true);
                }
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制');
                }).catch(() => {
                    fallback(text);
                });
            } else {
                fallback(text);
            }
        }
    </script>
