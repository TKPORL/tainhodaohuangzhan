<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>身份证生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        :root {
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.7);
            --ios-border: rgba(255, 255, 255, 0.5);
            --ios-text: #1c1c1e;
            --ios-text-2: #8E8E93;
            --ios-text-3: #C7C7CC;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
        }

        html, body {
            background-color: var(--ios-bg);
            color: var(--ios-text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 80px;
        }

        .app {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ========== 标题区 ========== */
        .header {
            text-align: center;
            padding: 8px 12px 16px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.04s forwards;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--ios-text);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--ios-text-2);
            font-weight: 400;
        }

        /* ========== 玻璃卡片基础 ========== */
        .glass {
            background: var(--ios-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid var(--ios-border);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        /* ========== 信息卡（主卡片） ========== */
        .info-card {
            padding: 4px 0;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.12s forwards;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background-color 0.18s var(--ease-ios);
            min-height: 64px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row:active {
            background-color: rgba(0, 0, 0, 0.03);
        }

        @media (hover: hover) {
            .info-row:hover {
                background-color: rgba(0, 0, 0, 0.025);
            }
        }

        .badge {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .badge.blue { background: linear-gradient(135deg, #5AC8FA, #007AFF); }
        .badge.green { background: linear-gradient(135deg, #66D482, #34C759); }

        .info-text {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 12px;
            color: var(--ios-text-2);
            font-weight: 500;
        }

        .info-value {
            font-size: 17px;
            color: var(--ios-text);
            font-weight: 600;
            letter-spacing: 0.01em;
            word-break: break-all;
            line-height: 1.3;
        }

        .chev {
            flex: 0 0 auto;
            color: var(--ios-text-3);
            font-size: 14px;
            font-weight: 300;
        }

        /* ========== 胶囊按钮 ========== */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            transition: transform 0.18s var(--ease-ios), background-color 0.18s var(--ease-ios), box-shadow 0.18s var(--ease-ios), opacity 0.18s var(--ease-ios);
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.2s forwards;
        }

        .btn-primary {
            background: var(--ios-blue);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.96) translateY(0);
            opacity: 0.9;
        }

        .btn-ghost {
            background: transparent;
            color: var(--ios-red);
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            box-shadow: none;
            min-height: 40px;
        }

        .btn-ghost:active {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .btn-icon {
            display: inline-flex;
            font-size: 15px;
        }

        /* ========== 分组标题 ========== */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--ios-text-2);
            text-transform: none;
            padding: 0 4px;
            margin-bottom: -8px;
            letter-spacing: 0.01em;
        }

        /* ========== 历史记录 ========== */
        .history-card {
            padding: 4px 0;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.28s forwards;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background-color 0.18s var(--ease-ios);
            min-height: 56px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:active {
            background-color: rgba(0, 0, 0, 0.03);
        }

        @media (hover: hover) {
            .history-item:hover {
                background-color: rgba(0, 0, 0, 0.025);
            }
        }

        .history-badge {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(0, 122, 255, 0.1);
            color: var(--ios-blue);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-text {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ios-text);
        }

        .history-id {
            font-size: 13px;
            color: var(--ios-text-2);
            word-break: break-all;
            letter-spacing: 0.02em;
        }

        .history-empty {
            padding: 24px 20px;
            text-align: center;
            color: var(--ios-text-2);
            font-size: 14px;
        }

        .history-footer {
            padding: 8px 12px 12px;
            display: flex;
            justify-content: center;
        }

        /* ========== 关于列表 ========== */
        .about-card {
            padding: 4px 0;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.36s forwards;
        }

        .about-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background-color 0.18s var(--ease-ios);
            min-height: 56px;
            text-decoration: none;
            color: inherit;
        }

        .about-row:last-child {
            border-bottom: none;
        }

        .about-row:active {
            background-color: rgba(0, 0, 0, 0.03);
        }

        @media (hover: hover) {
            .about-row:hover {
                background-color: rgba(0, 0, 0, 0.025);
            }
        }

        .about-badge {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-badge.blue { background: linear-gradient(135deg, #5AC8FA, #007AFF); }
        .about-badge.green { background: linear-gradient(135deg, #66D482, #34C759); }
        .about-badge.orange { background: linear-gradient(135deg, #FFB340, #FF9500); }

        .about-text {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .about-main {
            font-size: 15px;
            font-weight: 500;
            color: var(--ios-text);
        }

        .about-sub {
            font-size: 13px;
            color: var(--ios-text-2);
            word-break: break-all;
        }

        /* ========== 版权 ========== */
        .copy {
            text-align: center;
            font-size: 12px;
            color: var(--ios-text-3);
            padding-top: 8px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s var(--ease-ios) 0.44s forwards;
        }

        .copy a {
            color: var(--ios-blue);
            text-decoration: none;
        }

        /* ========== Modal ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s var(--ease-ios), visibility 0.28s var(--ease-ios);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid var(--ios-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transform: scale(0.92);
            opacity: 0;
            transition: transform 0.32s var(--ease-ios), opacity 0.32s var(--ease-ios);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            text-align: center;
            padding: 20px 20px 12px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ios-text);
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--ios-text-2);
            margin-top: 4px;
        }

        .modal-body {
            padding: 0 12px 4px;
        }

        .modal-list {
            background: rgba(120, 120, 128, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background-color 0.18s var(--ease-ios);
            text-decoration: none;
            color: inherit;
        }

        .modal-list-row:last-child { border-bottom: none; }

        .modal-list-row:active { background-color: rgba(0, 0, 0, 0.04); }

        @media (hover: hover) {
            .modal-list-row:hover { background-color: rgba(0, 0, 0, 0.03); }
        }

        .modal-footer {
            padding: 12px 16px 18px;
            display: flex;
            justify-content: center;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ios-text);
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            border: 1px solid var(--ios-border);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.28s var(--ease-ios), transform 0.28s var(--ease-ios), visibility 0.28s var(--ease-ios);
            max-width: calc(100vw - 40px);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            color: var(--ios-green);
            font-size: 15px;
            font-weight: 700;
        }

        /* ========== 动画 ========== */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            body { padding: 24px 12px 60px; }
            .app { gap: 20px; }
            .header h1 { font-size: 24px; }
            .info-value { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        *:focus { outline: none; }
    </style>
</head>
<body>

<div class="app">

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="polite">
    <span class="toast-icon">✓</span>
    <span id="toastText">已复制</span>
</div>

<script>
    // 身份证数据数组（从文件加载）
    let idCardData = [];
    let dataLoaded = false;

    // 加载身份证数据文件
    async function loadIdCardData() {
        try {
            const response = await fetch('身份证＋姓名数据(10W条).txt');
            const arrayBuffer = await response.arrayBuffer();
            const decoder = new TextDecoder('GBK');
            const text = decoder.decode(arrayBuffer);
            const lines = text.split('\n').filter(line => line.trim() !== '');
            idCardData = lines.map(line => {
                const parts = line.split('----');
                if (parts.length === 2) {
                    return { name: parts[0].trim(), id: parts[1].trim() };
                }
                return null;
            }).filter(item => item !== null);
            dataLoaded = true;
            console.log(`成功加载 ${idCardData.length} 条身份证数据`);
        } catch (error) {
            console.error('加载数据失败:', error);
            idCardData = [
                { name: "张三", id: "110101199001011234" },
                { name: "李四", id: "310101199102022345" },
                { name: "王五", id: "440101199203033456" },
                { name: "赵六", id: "330101199304044567" },
                { name: "钱七", id: "420101199405055678" },
                { name: "孙八", id: "120101199506066789" },
                { name: "周九", id: "510101199607077890" },
                { name: "吴十", id: "320101199708088901" },
                { name: "郑一", id: "370101199809099012" },
                { name: "王二", id: "410101199910100123" }
            ];
            dataLoaded = true;
        }
    }

    document.addEventListener('DOMContentLoaded', loadIdCardData);

    // 历史记录
    let history = [];

    // Toast
    let toastTimer = null;
    function showToast(message) {
        const toast = document.getElementById('toast');
        const text = document.getElementById('toastText');
        text.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // 复制文本（优先 Clipboard API，降级 textarea）
    async function copyText(text, type) {
        if (!text || text.trim() === '' || text.trim() === '——') {
            showToast('请先获取身份证信息');
            return;
        }
        const value = text.trim();
        try {
            await navigator.clipboard.writeText(value);
            showToast(`${type}已复制`);
        } catch (err) {
            const ta = document.createElement('textarea');
            ta.value = value;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            showToast(`${type}已复制`);
        }
    }

    function copyName() {
        copyText(document.getElementById('nameDisplay').textContent, '姓名');
    }

    function copyId() {
        copyText(document.getElementById('idDisplay').textContent, '身份证号');
    }

    // 获取随机身份证
    async function getRandomId() {
        if (!dataLoaded) {
            showToast('数据加载中，请稍候...');
            while (!dataLoaded) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }
        const idx = Math.floor(Math.random() * idCardData.length);
        const item = idCardData[idx];
        document.getElementById('nameDisplay').textContent = item.name;
        document.getElementById('idDisplay').textContent = item.id;
        addToHistory(item.name, item.id);
        showToast('已获取随机身份证');
    }

    // 添加到历史记录
    function addToHistory(name, id) {
        history.unshift({ name, id });
        if (history.length > 20) history.pop();
        renderHistory();
    }

    // 渲染历史记录
    function renderHistory() {
        const list = document.getElementById('historyList');
        const footer = document.getElementById('historyFooter');
        if (history.length === 0) {
            list.innerHTML = '<div class="history-empty">暂无历史记录</div>';
            footer.style.display = 'none';
            return;
        }
        footer.style.display = 'flex';
        // 对字符进行转义，避免 HTML 注入
        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
        list.innerHTML = history.map((item, i) => `
            <div class="history-item" onclick="copyHistoryItem(${i})">
                <span class="history-badge">${Math.min(i + 1, 99)}</span>
                <div class="history-text">
                    <span class="history-name">${esc(item.name)}</span>
                    <span class="history-id">${esc(item.id)}</span>
                </div>
                <span class="chev">›</span>
            </div>
        `).join('');
    }

    // 复制历史记录项
    function copyHistoryItem(index) {
        const item = history[index];
        if (!item) return;
        const text = `${item.name}\n${item.id}`;
        copyText(text, '姓名和身份证号');
    }

    // 清空历史记录
    function clearHistory() {
        history = [];
        renderHistory();
        showToast('已清空历史记录');
    }

    // 弹窗
    function openAboutModal() {
        document.getElementById('aboutModal').classList.add('active');
    }

    function closeAboutModal(event) {
        if (event && event.target === event.currentTarget) {
            document.getElementById('aboutModal').classList.remove('active');
        }
    }

    function closeAboutModalForce() {
        document.getElementById('aboutModal').classList.remove('active');
    }

    // 打开链接
    function go(url) {
        window.open(url, '_blank', 'noopener,noreferrer');
    }

    // 复制联系方式
    function copyContact(type) {
        let text = '';
        let label = '';
        if (type === 'email') { text = 'Tsinhos@qq.com'; label = '邮箱'; }
        else if (type === 'qq') { text = '3496454360'; label = 'QQ'; }
        copyText(text, label);
    }

    // ESC 关闭弹窗
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            document.getElementById('aboutModal').classList.remove('active');
        }
    });
</script>
</body>
</html>
